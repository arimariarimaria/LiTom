CONFIG_ZMK_BLE=y

# Persist the split Bluetooth bond across power cycles.
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y

CONFIG_I2C_NRFX=y

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORTING_FETCH_MODE_STATE_OF_CHARGE=y

CONFIG_ZMK_KEYBOARD_NAME="LiTom"

CONFIG_ZMK_DISPLAY=y
# Reduce display timer wakeups; key scanning and HID timing are unchanged.
CONFIG_ZMK_DISPLAY_TICK_PERIOD_MS=30
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
# Let BLE notify threads (priority 4/5) preempt display work.
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_PRIORITY=6
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=y
# Preempt display work (priority 6) when a key notification is ready to send.
CONFIG_ZMK_SPLIT_BLE_PERIPHERAL_PRIORITY=4
CONFIG_ZMK_WPM=n

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=240

# Normal firmware: no diagnostic logger, USB log port, or thread analyzer.
# Keep Studio's USB transport enabled separately through its build snippet.
CONFIG_ZMK_USB_LOGGING=n
CONFIG_ZMK_RTT_LOGGING=n
CONFIG_LOG=n
CONFIG_THREAD_ANALYZER=n
