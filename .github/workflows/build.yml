name: Build ZMK firmware
on: [push, pull_request, workflow_dispatch]

jobs:
  compatibility-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: cormoran/zmk-module-runtime-input-processor
          ref: 43618985f8c9d5457cc333b7ca0733f2d361911e
          path: .runtime-input-processor
      - name: Test binding recovery and temporary layer transitions
        run: python3 scripts/test_compat.py .runtime-input-processor/src/pointing/input_processor_runtime.c
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: pukuhei/zmk-tom-oled
          ref: b1db06b55bea5bf340760d3a5a7c0b709aa3caa6
          path: .tom-oled
      - name: Test peripheral OLED pixels and event handling
        run: python3 scripts/test_peripheral_oled.py .tom-oled/boards/shields/tom_oled/widgets
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: cormoran/zmk-feature-runtime-combo
          ref: d9490e7b5d41c516221d131241009e81740efcee
          path: .runtime-combo
      - name: Test combo RPC save notifications and error handling
        run: python3 scripts/test_runtime_combo_rpc.py .runtime-combo/src/studio/runtime_combo_handler.c
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: cormoran/zmk
          ref: e5c9b6915b56801193e359dd9bad4a167ce0d1b8
          path: .studio-zmk
          sparse-checkout: app/src/studio
      - name: Test Studio USB FIFO backpressure and retry
        run: python3 scripts/test_studio_uart.py .studio-zmk/app/src/studio/uart_rpc_transport.c
  build:
    uses: cormoran/zmk/.github/workflows/build-user-config.yml@e5c9b6915b56801193e359dd9bad4a167ce0d1b8
